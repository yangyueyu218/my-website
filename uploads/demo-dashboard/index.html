<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>销售看板 · 交互示例</title><link rel="stylesheet" href="style.css"></head><body><header><div><small>DATA PLAYGROUND / DEMO</small><h1>把趋势看清楚</h1></div><label>观察维度<select id="metric"><option value="sales">销售额</option><option value="orders">订单量</option></select></label></header><div class="metrics"><section><span id="metric-label">累计销售额</span><strong id="total"></strong></section><section><span>较上期</span><strong id="growth"></strong></section><section><span>观察周期</span><strong>7 <small>个月</small></strong></section></div><div class="chart"><div class="chart-title"><h2 id="chart-title">销售额趋势</h2><span>模拟数据</span></div><div id="bars" aria-live="polite"></div><p id="readout">点击柱形，查看当月数值。</p></div><footer>交互看板示例 · HTML + CSS + JavaScript</footer><script src="chart.js"></script></body></html>
