  .stat span b { color:#f5d27a; font-size:22px; margin-right:4px; }
  .map-wrap { max-width:1000px; margin:24px auto 0; position:relative;

  .region { fill:rgba(255,255,255,.10); stroke:#f5d27a; stroke-width:1.2; cursor:pointer; transition:fill .25s; }
  .region:hover { fill:rgba(245,210,122,.32); }
  .region.lit { fill:rgba(245,210,122,.20); }
  .rlabel { fill:#fff; font-size:13px; font-weight:600; text-anchor:middle; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  .star { pointer-events:none; }
  .leadline { stroke:#f5d27a; stroke-width:.8; opacity:.6; pointer-events:none; }
  .legend { max-width:1000px; margin:18px auto 0; font-size:13px; color:#f5d27a; text-align:center; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .modal-bg.show { display:flex; }
  .modal { background:#fff; color:#333; border-radius:14px; width:100%; max-width:440px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.4); }
  .modal-head { background:linear-gradient(135deg,#a51212,#7a0c0c); color:#fff; padding:16px 20px; font-size:18px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .modal-head .x { cursor:pointer; font-size:22px; line-height:1; }
  .modal-body { padding:20px; }
  .modal-body label { display:block; font-size:13px; color:#666; margin:12px 0 5px; }
  .modal-body input { width:100%; padding:9px 11px; border:1px solid #ccc; border-radius:7px; font-size:14px; }
  .lit-tag { display:inline-block; background:#a51212; color:#fff; font-size:12px; padding:3px 10px; border-radius:20px; margin-bottom:6px; }
  .btns { display:flex; gap:10px; margin-top:20px; }
  .btns button { flex:1; padding:11px; border:none; border-radius:8px; font-size:15px; cursor:pointer; font-weight:600; }
  .btn-save { background:#a51212; color:#fff; }
  .btn-off { background:#eee; color:#a51212; }
  .records { margin-top:14px; }
  .records h4 { font-size:13px; color:#666; margin-bottom:6px; }
  .rec-item { background:#f7f0e3; border-left:3px solid #a51212; padding:7px 10px; border-radius:5px; font-size:13px; margin-bottom:6px; }
  .rec-item .d { color:#a51212; font-weight:600; }
  .empty { color:#aaa; font-size:13px; }
  .loading { text-align:center; padding:40px; color:#f5d27a; }

let state = {};
let current = null;
const STORE_KEY = "ordos_lecture_map_v2";

async function loadState(){
  try { const r=await window.storage.get(STORE_KEY); if(r&&r.value) state=JSON.parse(r.value); }
  catch(e){ state={}; }
  REGIONS.forEach(rg=>{ if(!state[rg.id]) state[rg.id]={records:[]}; });
}
async function saveState(){ try{ await window.storage.set(STORE_KEY,JSON.stringify(state)); }catch(e){ console.error(e); } }

function starPath(cx,cy,r){
  let pts=[];
  for(let i=0;i<10;i++){ const a=Math.PI/5*i-Math.PI/2; const rad=i%2===0?r:r*0.4;
    pts.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1)); }
  return pts.join(" ");
}
// 在标签上方按授课次数排布星星，每行5颗
function starsFor(rg,n){
  if(n<=0) return "";
  const r=8, gap=20, perRow=5, baseY=rg.ly-20;
  let s="";
  for(let i=0;i<n;i++){
    const row=Math.floor(i/perRow);
    const inRow=Math.min(n-row*perRow,perRow);
    const idx=i%perRow;
    const cx=rg.lx+(idx-(inRow-1)/2)*gap;
    const cy=baseY-row*gap;
    s+=`<polygon class="star" points="${starPath(cx,cy,r)}" fill="#e8332a" stroke="#ffd36b" stroke-width="1"></polygon>`;
  }
  return s;
}

function renderMap(){
  const svg=document.getElementById("map");
  let html="";
  REGIONS.forEach(rg=>{
    const n=state[rg.id].records.length;
    html+=`<path class="region ${n>0?'lit':''}" d="${rg.d}" data-id="${rg.id}"></path>`;
  });
  REGIONS.forEach(rg=>{ html+=`<text class="rlabel" x="${rg.lx}" y="${rg.ly+4}">${rg.name}</text>`; });
  REGIONS.forEach(rg=>{ html+=starsFor(rg,state[rg.id].records.length); });
  svg.innerHTML=html;
  svg.querySelectorAll(".region").forEach(p=>p.addEventListener("click",()=>openModal(p.dataset.id)));
  updateStat();
}
function updateStat(){
  let lit=0,les=0;
  REGIONS.forEach(rg=>{ const n=state[rg.id].records.length; if(n>0)lit++; les+=n; });
  document.getElementById("litCount").textContent=lit;
  document.getElementById("lessonCount").textContent=les;
}
function openModal(id){
  current=id;
  const rg=REGIONS.find(r=>r.id===id); const s=state[id];
  document.getElementById("mTitle").textContent=rg.name;
  document.getElementById("litStatus").innerHTML=s.records.length?`<span class="lit-tag">已点亮 ★ × ${s.records.length}</span>`:'';
  document.getElementById("mDate").value=new Date().toISOString().slice(0,10);
  document.getElementById("mTheme").value="";
  renderRecords(id);
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }
function renderRecords(id){
  const recs=state[id].records; const box=document.getElementById("recList");
  if(!recs.length){ box.innerHTML='<div class="empty">暂无记录</div>'; return; }
  box.innerHTML=recs.map((r,i)=>`<div class="rec-item"><span class="d">${r.date}</span> ｜ ${r.theme||'（未填主题）'} <span style="float:right;cursor:pointer;color:#999" data-del="${i}">删除</span></div>`).join("");
  box.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",async()=>{
    state[id].records.splice(+el.dataset.del,1); await saveState(); renderRecords(id); renderMap(); openModalRefresh(id);
  }));
}
function openModalRefresh(id){ const s=state[id]; document.getElementById("litStatus").innerHTML=s.records.length?`<span class="lit-tag">已点亮 ★ × ${s.records.length}</span>`:''; }
async function saveRecord(){
  const date=document.getElementById("mDate").value;
  const theme=document.getElementById("mTheme").value.trim();
  if(!date){ alert("请选择授课日期"); return; }
  state[current].records.push({date,theme});
  await saveState(); renderMap(); renderRecords(current); openModalRefresh(current);
  document.getElementById("mTheme").value="";
}
async function turnOff(){
  if(!confirm("确认清空该旗区？所有授课记录与红星将被清除。")) return;
  state[current]={records:[]}; await saveState(); renderMap(); closeModal();
}
document.getElementById("mClose").onclick=closeModal;
document.getElementById("modalBg").onclick=e=>{ if(e.target.id==="modalBg") closeModal(); };
document.getElementById("mSave").onclick=saveRecord;
document.getElementById("mOff").onclick=turnOff;
(async function(){ await loadState(); document.getElementById("loading").style.display="none";
  document.getElementById("map").style.display="block"; renderMap(); })();
</script>
